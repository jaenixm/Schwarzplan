name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: brew install gdal geos

      - name: Install Flet
        run: pip install flet

      - name: Build macOS app
        run: flet build macos --verbose --yes

      - name: Inject macOS dot-folders
        run: |
          echo "Downloading dependencies to extract .dylibs"
          pip install --target /tmp/inject_deps Pillow numpy fiona pyproj shapely geopandas osmnx
          SITE_PACKAGES="build/macos/schwarzplan.app/Contents/Frameworks/serious_python_darwin.framework/Resources/python.bundle/Contents/Resources/site-packages"
          mkdir -p "$SITE_PACKAGES"
          find /tmp/inject_deps -type d -name ".dylibs" -print0 | while IFS= read -r -d '' dir; do
            parent=$(dirname "$dir")
            pkgname=$(basename "$parent")
            echo "Injecting $dir into $pkgname"
            if [ -d "$dir" ]; then
              cp -a "$dir" "$SITE_PACKAGES/$pkgname/"
            fi
          done
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schwarzplan-macOS
          path: build/macos/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install flet

      - name: Build Windows app
        run: flet build windows --verbose --yes --no-rich-output

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schwarzplan-Windows
          path: build/windows/
