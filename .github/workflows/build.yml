name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet

      - name: Build macOS app
        run: flet build macos --verbose --yes

      - name: Package macOS App
        run: |
          cd build/macos
          zip -r -q ../../Schwarzplan-macOS.zip schwarzplan.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schwarzplan-macOS
          path: Schwarzplan-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet

      - name: Build Windows app
        run: flet build windows --verbose --yes --no-rich-output

      - name: Package Windows App
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/* -DestinationPath Schwarzplan-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schwarzplan-Windows
          path: Schwarzplan-Windows.zip

