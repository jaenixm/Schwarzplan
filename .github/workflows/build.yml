name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  FLET_VERSION: 0.84.0

jobs:
  # Catches syntax errors and bad imports in seconds, before the slow builds run.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sources
        run: python -m compileall -q src generate_schwarzplan.py
      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install "flet==${FLET_VERSION}"

      - name: Build macOS app
        run: flet build macos --verbose --yes

      # upload-artifact zips its input but drops symlinks and the executable
      # bit, which leaves a .app that macOS refuses to open. ditto is what
      # Apple's own notarisation flow uses and preserves the bundle intact.
      - name: Package .app
        run: |
          APP=$(find build/macos -maxdepth 2 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
          echo "Packaging $APP"

          # flet build seals a symlink to this runner's ~/.pub-cache into the
          # bundle. It points outside the bundle by absolute path, so on anyone
          # else's machine it dangles and makes the documented
          # "xattr -dr com.apple.quarantine" print an alarming error. Removing
          # it breaks the ad-hoc signature, so re-sign afterwards. Only
          # absolute targets are stripped; the framework's own relative
          # symlinks must stay.
          find "$APP" -type l -exec sh -c \
            'case "$(readlink "$1")" in /*) echo "stripping $1"; rm -f "$1";; esac' _ {} \;
          codesign --force --deep --sign - "$APP"
          codesign -v --deep --strict "$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" Schwarzplan-macOS.zip

          rm -rf /tmp/verify
          ditto -V -x -k Schwarzplan-macOS.zip /tmp/verify
          VERIFY="/tmp/verify/$(basename "$APP")"
          test -x "$VERIFY/Contents/MacOS/$(basename "$APP" .app)" \
            || { echo "Executable bit lost in packaging"; exit 1; }
          ABS=$(find "$VERIFY" -type l -exec sh -c \
            'case "$(readlink "$1")" in /*) echo x;; esac' _ {} \; | wc -l)
          test "$ABS" -eq 0 \
            || { echo "$ABS symlink(s) pointing outside the bundle would ship"; exit 1; }
          codesign -v --deep --strict "$VERIFY" \
            || { echo "Signature invalid after packaging"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Schwarzplan-macOS
          path: Schwarzplan-macOS.zip
          if-no-files-found: error

  build-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install "flet==$env:FLET_VERSION"

      - name: Build Windows app
        run: flet build windows --verbose --yes --no-rich-output

      - name: Package build
        run: Compress-Archive -Path build/windows/* -DestinationPath Schwarzplan-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Schwarzplan-Windows
          path: Schwarzplan-Windows.zip
          if-no-files-found: error

  # Tagged builds become a Release, so testers get a stable link instead of a
  # 90-day artifact that needs a GitHub login to download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Installing

            **macOS** — unzip, move `Schwarzplan.app` to Applications, then run:

            ```
            xattr -dr com.apple.quarantine /Applications/Schwarzplan.app
            ```

            This build is not signed with an Apple Developer certificate, so
            macOS quarantines it. The command above clears that. Without it you
            will see "Schwarzplan is damaged and can't be opened".

            **Windows** — unzip and run `Schwarzplan.exe`. SmartScreen will warn
            about an unrecognised publisher: choose "More info" then "Run anyway".
